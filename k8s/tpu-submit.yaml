# The TPU submission service and Tartan storage identities. Applied by
# scripts/03_deploy_hub.sh, which fills in the __PLACEHOLDERS__ from config.env.
#
# tpu-submit is the only pod in the namespace that can create Jobs. Students talk to it
# with their JupyterHub token; it builds every Job from one fixed template (see
# services/tpu-submit/tpu_submit/jobspec.py). Students have no Kubernetes RBAC at all.
#
# Four Kubernetes service accounts, bound via Workload Identity in scripts/12_setup_storage.sh:
#   tpu-submit    objectAdmin on STUDENT_BUCKET, objectViewer on TARTAN_BUCKET
#   tpu-job       objectViewer on TARTAN_BUCKET & DATASET_BUCKET; runs student code on TPU
#   student       objectViewer on TARTAN_BUCKET (read-only /tartan/11785 mount in notebooks)
#   tartan-admin  objectAdmin on TARTAN_BUCKET (staff/admin pods and make shared-env)
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tpu-submit
  namespace: __NAMESPACE__
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tpu-job
  namespace: __NAMESPACE__
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: student
  namespace: __NAMESPACE__
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tartan-admin
  namespace: __NAMESPACE__
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: tpu-submit
  namespace: __NAMESPACE__
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create", "delete"]
  - apiGroups: ["kueue.x-k8s.io"]
    resources: ["workloads"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: tpu-submit
  namespace: __NAMESPACE__
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: tpu-submit
subjects:
  - kind: ServiceAccount
    name: tpu-submit
    namespace: __NAMESPACE__
---
# Allows staff running hub_admin.py inside the Admin Workstation profile (or via kubectl)
# to inspect/expand student PVCs and update the cmu-user-overrides ConfigMap.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: tartan-admin
  namespace: __NAMESPACE__
rules:
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "list", "watch", "patch", "update"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch", "create", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: tartan-admin
  namespace: __NAMESPACE__
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: tartan-admin
subjects:
  - kind: ServiceAccount
    name: tartan-admin
    namespace: __NAMESPACE__
---
# Allows JupyterHub's unified_pre_spawn_hook to read the cmu-user-overrides ConfigMap.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: hub-configmap-reader
  namespace: __NAMESPACE__
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: hub-configmap-reader
  namespace: __NAMESPACE__
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: hub-configmap-reader
subjects:
  - kind: ServiceAccount
    name: hub
    namespace: __NAMESPACE__
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tpu-submit
  namespace: __NAMESPACE__
  labels:
    app.kubernetes.io/name: tpu-submit
spec:
  # One replica. The one-active-job rule is enforced with an in-process lock, and the
  # reconcile loop assumes it is the only writer of meta.json.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: tpu-submit
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tpu-submit
        # Lets the z2jh hub NetworkPolicy accept /hub/api/user calls from this pod.
        hub.jupyter.org/network-access-hub: "true"
    spec:
      serviceAccountName: tpu-submit
      priorityClassName: jupyterhub-core
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: tpu-submit
          image: __SUBMIT_IMAGE__
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: NAMESPACE
              value: __NAMESPACE__
            - name: PUBLIC_URL
              value: http://tpu-submit.__NAMESPACE__.svc.cluster.local:8080
            - name: HUB_API_URL
              value: http://hub:8081/hub/api
            - name: TPU_JOB_IMAGE
              value: __TPU_JOB_IMAGE__
            - name: STUDENT_BUCKET
              value: __STUDENT_BUCKET__
            - name: TARTAN_BUCKET
              value: "__TARTAN_BUCKET__"
            - name: SHARED_ENV_NAME
              value: "__SHARED_ENV_NAME__"
            - name: DATASETS
              value: "__DATASETS__"
            - name: DEFAULT_DATASET
              value: "__DEFAULT_DATASET__"
            - name: TPU_ACCELERATOR
              value: __TPU_ACCELERATOR__
            - name: TPU_TOPOLOGY
              value: "__TPU_TOPOLOGY__"
            - name: MAX_JOB_HOURS
              value: "__MAX_JOB_HOURS__"
            - name: CHIP_HOUR_BUDGET
              value: "__CHIP_HOUR_BUDGET__"
            - name: JOB_DISK
              value: __JOB_DISK__
            - name: SPOOL_DIR
              value: /spool
            # The root filesystem is read-only; anything that wants a cache dir gets /tmp.
            - name: HOME
              value: /tmp
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 30
            failureThreshold: 4
          resources:
            requests:
              cpu: 500m
              memory: 2Gi
              ephemeral-storage: 4Gi
            limits:
              cpu: "2"
              memory: 2Gi
              ephemeral-storage: 4Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: spool
              mountPath: /spool
            - name: tmp
              mountPath: /tmp
      volumes:
        # Snapshot uploads wait here until they are checked and copied to the bucket.
        - name: spool
          emptyDir:
            sizeLimit: 3Gi
        - name: tmp
          emptyDir:
            sizeLimit: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: tpu-submit
  namespace: __NAMESPACE__
spec:
  selector:
    app.kubernetes.io/name: tpu-submit
  ports:
    - name: http
      port: 8080
      targetPort: http
---
# Only student notebooks and TPU job pods may connect. The notebooks' own egress policy
# (singleuser.networkPolicy in jupyterhub-values.yaml) also names this pod, because z2jh
# denies private destinations by default.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: tpu-submit
  namespace: __NAMESPACE__
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: tpu-submit
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              component: singleuser-server
        - podSelector:
            matchLabels:
              app.kubernetes.io/managed-by: tpu-submit
      ports:
        - protocol: TCP
          port: 8080
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: tpu-submit
  namespace: __NAMESPACE__
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: tpu-submit
