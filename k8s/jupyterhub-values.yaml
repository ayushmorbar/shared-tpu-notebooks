# Zero to JupyterHub for a university LLM course.
#
# SECURITY NOTE (2026 CIS GKE Benchmark / NIST SP 800-190 compliance):
# This configuration enforces strict Pod Security Standards, non-root execution,
# NetworkPolicies for isolation, and gVisor sandboxing for untrusted notebooks.
#
# Read the profile list first. It contains the reason for the design.
#
# GKE gives one pod per TPU node and that pod owns every chip on the node. A v5e chip
# cannot be shared. A TPU-backed notebook therefore holds a $1.35/hr chip for as long as
# the browser tab is open, whether the student is running code or reading the
# assignment. For 300 students that is $405/hr, and most of them are typing.
#
# So students get a CPU notebook with /tartan/11785 mounted read-only (shared Python
# environments and datasets), and TPU work leaves the notebook as a queued Job.
# notebooks/submit_tpu.py sends the student's script folder to the tpu-submit service
# (k8s/tpu-submit.yaml), which is the only thing allowed to create Jobs. The chip is
# held for as long as the job runs, not for as long as the notebook is open.
#
# The pinned TPU notebook still exists, because interactive TPU debugging is a real
# need. It is restricted to staff. That restriction is the cost control.
#
# Pattern credit: ai-on-gke/quick-start-guides jupyter/profiles.md documents
# extra_resource_limits + node_selector for TPU profiles. Its template hardcodes
# ct4p-hightpu-4t / tpu-v4-podslice / 2x2x1 -- v4, which is us-central2-only and not
# reachable from an ordinary project. The labels below are the v5e equivalent.

hub:
  db:
    pvc:
      storage: 32Gi
  config:
    JupyterHub:
      admin_access: true
    Authenticator:
      # Local part of the Google identity IAP forwards, i.e. everything before the @.
      admin_users:
        - instructor
      # IAP decides who gets in. Anyone reaching the hub has already been checked by
      # Google against roles/iap.httpsResourceAccessor, so a second allowlist here would
      # only reject people IAP just admitted. Without this, JupyterHub authenticates the
      # user and then refuses them, which reads as a broken login rather than a policy.
      #
      # Restrict membership on the IAP binding, not here. For a course that means a
      # group: gcloud projects add-iam-policy-binding PROJECT \
      #   --member=group:students@your-university.edu \
      #   --role=roles/iap.httpsResourceAccessor
      allow_all: true
    # The token JupyterHub puts in every notebook (JUPYTERHUB_API_TOKEN) carries only
    # these scopes. The last one lets the notebook call the tpu-submit service, which
    # checks it by asking the hub who owns the token (GET /hub/api/user).
    Spawner:
      server_token_scopes:
        - "users:activity!user"
        - "access:servers!server"
        - "access:services!service=tpu-submit"
    # Notebooks get no Kubernetes credential by default. Students submit TPU work through
    # the tpu-submit service, never to the Kubernetes API.
    KubeSpawner:
      automount_service_account_token: false
  # Registers the TPU submission service by name so the scope above can refer to it.
  # It has no URL here: notebooks reach it directly at TPU_SUBMIT_URL, not through the
  # hub's proxy, and it needs no hub API token of its own.
  services:
    tpu-submit:
      display: false
  # A token can only hold scopes its owner has, so users need the service scope too.
  loadRoles:
    user:
      scopes:
        - "self"
        - "access:services!service=tpu-submit"
  # Trust the identity IAP already verified, instead of asking the user again.
  #
  # IAP authenticates at the load balancer and forwards the result as a header:
  #
  #   X-Goog-Authenticated-User-Email: accounts.google.com:someone@example.com
  #
  # The header is only trustworthy because traffic cannot reach the pods except through
  # the GFE. That is enforced by the firewall, which allows 130.211.0.0/22 and
  # 35.191.0.0/16 and nothing else. Expose this Service any other way and the header
  # becomes forgeable, so do not pair this authenticator with a plain LoadBalancer.
  extraConfig:
    cmu-branding: |
      c.JupyterHub.template_vars = {
          'announcement': (
              '<div style="background: linear-gradient(135deg, #C41230 0%, #8A001A 100%); '
              'color: #FFFFFF; padding: 12px 18px; border-radius: 6px; box-shadow: 0 2px 8px rgba(0,0,0,0.15); '
              'font-family: -apple-system, BlinkMacSystemFont, \'Segoe UI\', Roboto, sans-serif; '
              'margin-bottom: 16px; font-size: 14px; line-height: 1.5; display: flex; align-items: center; justify-content: space-between;">'
              '<span><strong>🎓 Carnegie Mellon University — 11-785 Introduction to Deep Learning</strong> | '
              'Cloud TPU v5e Shared Accelerator Hub &bull; Prof. Bhiksha Raj &amp; Prof. Rita Singh</span>'
              '<a href="https://deeplearning.cs.cmu.edu/" target="_blank" '
              'style="color: #FFFFFF; background: rgba(255,255,255,0.2); padding: 4px 10px; border-radius: 4px; '
              'text-decoration: none; font-size: 12px; font-weight: 600; margin-left: 12px; white-space: nowrap;">'
              'Course Home &rarr;</a>'
              '</div>'
          ),
          'hub_title': 'CMU 11-785 Deep Learning Hub',
      }
      c.JupyterHub.admin_access = True
    profile-visibility: |
      # Make all profiles visible on the spawner page for JupyterHub admins
      # (staff/instructors), while students see only profiles matching their groups.
      async def dynamic_profile_form(spawner):
          all_profiles = spawner.profile_list
          if spawner.user.admin:
              # Return a copy with allowed_groups/allowed_users stripped so KubeSpawner
              # renders every option in the dropdown for admins.
              unlocked = []
              for p in all_profiles:
                  p_copy = dict(p)
                  p_copy.pop("allowed_groups", None)
                  p_copy.pop("allowed_users", None)
                  unlocked.append(p_copy)
              return spawner._options_form_default_from_profile_list(unlocked)
          return await spawner._default_options_form()

      c.KubeSpawner.options_form = dynamic_profile_form
    user-resource-overrides: |
      # Unified pre_spawn_hook:
      # 1. Dynamic Per-User Resource & Tier Overrides via ConfigMap 'cmu-user-overrides'
      # 2. Tartan Storage Permission Enforcement (Read-Only for students, Read-Write for admins)
      import copy
      import json
      import os
      from kubernetes_asyncio import client, config

      async def unified_pre_spawn_hook(spawner):
          username = spawner.user.name
          is_admin = spawner.user.admin
          user_groups = {g.name for g in spawner.user.groups}
          is_staff = is_admin or bool(user_groups.intersection({"staff", "admin"}))

          # --- Part A: Dynamic Per-User Overrides from ConfigMap ---
          ns = os.environ.get("POD_NAMESPACE", "cmu-idl")
          try:
              config.load_incluster_config()
              async with client.ApiClient() as api:
                  v1 = client.CoreV1Api(api)
                  cm = await v1.read_namespaced_config_map("cmu-user-overrides", ns)
                  overrides = json.loads((cm.data or {}).get("overrides.json", "{}"))
                  u_cfg = overrides.get(username, {})
                  if u_cfg:
                      spawner.log.info(f"Applying custom resource override for {username}: {u_cfg}")
                      if "cpu_limit" in u_cfg:
                          spawner.cpu_limit = float(u_cfg["cpu_limit"])
                      if "cpu_guarantee" in u_cfg:
                          spawner.cpu_guarantee = float(u_cfg["cpu_guarantee"])
                      if "mem_limit" in u_cfg:
                          spawner.mem_limit = str(u_cfg["mem_limit"])
                      if "mem_guarantee" in u_cfg:
                          spawner.mem_guarantee = str(u_cfg["mem_guarantee"])
          except Exception as e:
              spawner.log.debug(f"No custom resource override applied for {username}: {e}")

          # --- Part B: Tartan Storage Access Control ---
          # Deep-copy volumes and volume_mounts so mutating mountOptions for an admin
          # never leaks into subsequent student spawns.
          spawner.volumes = copy.deepcopy(list(spawner.volumes))
          spawner.volume_mounts = copy.deepcopy(list(spawner.volume_mounts))

          for vol in spawner.volumes:
              if vol.get("name") == "course-tartan" and "csi" in vol:
                  attrs = vol["csi"].setdefault("volumeAttributes", {})
                  opts = attrs.get("mountOptions", "")
                  opt_list = [o for o in opts.split(",") if o and o != "ro"]
                  if is_staff:
                      attrs["mountOptions"] = ",".join(opt_list)
                      vol["csi"]["readOnly"] = False
                  else:
                      opt_list.append("ro")
                      attrs["mountOptions"] = ",".join(opt_list)
                      vol["csi"]["readOnly"] = True

          for vm in spawner.volume_mounts:
              if vm.get("name") == "course-tartan":
                  vm["readOnly"] = not is_staff

          if is_staff:
              # tartan-admin has Workload Identity objectAdmin on gs://TARTAN_BUCKET
              # and K8s RBAC to manage student PVCs and cmu-user-overrides via hub_admin.py.
              spawner.service_account = "tartan-admin"
              spawner.automount_service_account_token = True
          else:
              spawner.service_account = "student"
              spawner.automount_service_account_token = False

      c.KubeSpawner.pre_spawn_hook = unified_pre_spawn_hook
    pod-security: |
      # Avoid recursive chown across high-inode volumes on pod startup.
      c.KubeSpawner.pod_security_context = {
          "fsGroup": 1000,
          "fsGroupChangePolicy": "OnRootMismatch",
      }
    gcsfuse-config: |
      # Required on every singleuser pod so the GKE GCS FUSE CSI webhook injects
      # the sidecar that mounts /tartan/11785 and /ocean.
      c.KubeSpawner.extra_annotations = {
          "gke-gcsfuse/volumes": "true",
      }
      c.KubeSpawner.start_timeout = 900
    iap-auth: |
      import time
      import jwt
      import json
      import urllib.request
      from jupyterhub.auth import Authenticator
      from jupyterhub.handlers.login import LoginHandler
      from jupyterhub.utils import url_path_join
      from tornado import web

      IAP_JWT_HEADER = "X-Goog-IAP-JWT-Assertion"
      IAP_EMAIL_HEADER = "X-Goog-Authenticated-User-Email"
      IAP_PUBLIC_KEYS_URL = "https://www.gstatic.com/iap/verify/public_key"

      # Simple cache for public keys
      KEY_CACHE = {"keys": {}, "expires_at": 0}

      def get_iap_public_keys():
          now = time.time()
          if KEY_CACHE["keys"] and now < KEY_CACHE["expires_at"]:
              return KEY_CACHE["keys"]

          req = urllib.request.Request(IAP_PUBLIC_KEYS_URL)
          with urllib.request.urlopen(req) as response:
              cache_control = response.headers.get("Cache-Control", "")
              max_age = 3600
              for part in cache_control.split(","):
                  if part.strip().startswith("max-age="):
                      try:
                          max_age = int(part.split("=")[1])
                      except ValueError:
                          pass

              keys = json.loads(response.read())
              KEY_CACHE["keys"] = keys
              KEY_CACHE["expires_at"] = now + max_age
              return keys

      def decode_iap_jwt_claims(jwt_str: str) -> dict:
          """Decode and validate claims from the IAP signed JWT cryptographically."""
          header = jwt.get_unverified_header(jwt_str)
          key_id = header.get("kid")
          if not key_id:
              raise ValueError("No 'kid' found in JWT header")

          keys = get_iap_public_keys()
          pub_key = keys.get(key_id)
          if not pub_key:
              raise ValueError(f"Public key for kid {key_id} not found")

          # Verify the signature, issuer, and expiration
          claims = jwt.decode(
              jwt_str,
              key=pub_key,
              algorithms=["ES256"],
              options={"verify_aud": False},
              issuer="https://cloud.google.com/iap"
          )

          if "email" not in claims:
              raise ValueError("IAP JWT assertion missing verified email claim")

          return claims

      class IAPLoginHandler(LoginHandler):
          async def get(self):
              jwt_assertion = self.request.headers.get(IAP_JWT_HEADER, "")
              email = ""

              if not jwt_assertion:
                  raise web.HTTPError(
                      401,
                      "No IAP JWT assertion header found. You reached the hub without going through IAP.",
                  )

              try:
                  claims = decode_iap_jwt_claims(jwt_assertion)
                  email = claims["email"].strip().lower()
              except Exception as e:
                  self.log.warning(f"IAP JWT validation failed: {e}")
                  raise web.HTTPError(
                      401,
                      f"Invalid IAP JWT assertion: {e}",
                  )

              # Keep the local part so pod names stay readable. Safe while every user
              # comes from one domain; add the domain back if that stops being true.
              username = email.split("@")[0]
              user = await self.auth_to_user({"name": username})
              self.set_login_cookie(user)
              self.redirect(url_path_join(self.hub.server.base_url, "spawn"))

      class IAPAuthenticator(Authenticator):
          # No login form. The user already signed in at the load balancer.
          auto_login = True

          def get_handlers(self, app):
              return [(r"/login", IAPLoginHandler)]

          async def authenticate(self, handler, data=None):
              return None

      c.JupyterHub.authenticator_class = IAPAuthenticator
  # Autopilot rejects privileged pods and enforces Pod Security Standards. Give the
  # hub an explicit non-root context rather than letting the chart's default get
  # rewritten by the Autopilot mutating webhook.
  containerSecurityContext:
    runAsUser: 1000
    runAsGroup: 1000
    allowPrivilegeEscalation: false
  # Autopilot consolidates nodes freely, and it moved the hub and proxy twice during a
  # single afternoon of TPU node churn. Each move killed the port-forward. A PDB does not
  # make eviction impossible on a single replica, but it stops routine consolidation.
  pdb:
    enabled: true
    minAvailable: 1
  extraPodSpec:
    priorityClassName: jupyterhub-core

proxy:
  service:
    # ClusterIP, not LoadBalancer. An L4 LB can never get an address in this org, so it
    # retried and failed on a loop. The Ingress in k8s/ingress-iap.yaml fronts this
    # Service instead, and GKE builds NEGs pointing straight at the pods.
    type: ClusterIP
    annotations:
      cloud.google.com/neg: '{"ingress": true}'
      cloud.google.com/backend-config: '{"default": "hub-iap"}'
  chp:
    resources:
      requests:
        cpu: 200m
        memory: 512Mi
    pdb:
      enabled: true
      minAvailable: 1
    extraPodSpec:
      priorityClassName: jupyterhub-core

# Both of these are off for Autopilot.
#   userScheduler packs users onto the fewest nodes so the rest can scale down. On
#   Autopilot the platform already owns node packing, and the chart's scheduler needs
#   RBAC that Autopilot restricts.
#   prePuller pre-pulls the singleuser image onto every node with a DaemonSet. On
#   Autopilot that means holding nodes up purely to cache an image, which is the
#   opposite of scale-to-zero.
scheduling:
  userScheduler:
    enabled: false
  podPriority:
    enabled: false
  userPlaceholder:
    enabled: false

prePuller:
  hook:
    enabled: false
  continuous:
    enabled: false

cull:
  enabled: true
  # When false, admin servers (e.g. staff/instructors) are never killed by idle timeout or maxAge.
  adminUsers: __CULL_ADMIN_USERS__
  # A student who closes the laptop should not hold a pod all night. One hour idle,
  # checked every five minutes. maxAge catches the tab left open over a weekend.
  timeout: 3600
  every: 300
  maxAge: 28800

singleuser:
  # Required for GKE GCS FUSE CSI driver to inject sidecar and mount /tartan/11785
  extraAnnotations:
    gke-gcsfuse/volumes: "true"

  # Student KSA has Workload Identity read-only access (objectViewer) to TARTAN_BUCKET
  # and zero Kubernetes RBAC (automountServiceAccountToken: false).
  serviceAccountName: student

  # z2jh ships a `block-cloud-metadata` initContainer that runs privileged with
  # NET_ADMIN and installs an iptables rule against 169.254.169.254. Autopilot rejects
  # it outright.
  #
  # Meanwhile, the GKE GCS FUSE CSI sidecar on each pod must reach the GKE Workload
  # Identity metadata server (169.254.169.254) to exchange the pod's KSA identity for
  # a short-lived GCS token (read-only on TARTAN_BUCKET for `student`, read-write for
  # `tartan-admin`). Because the cluster runs Workload Identity in GKE_METADATA mode,
  # the node service account is never exposed—only the pod's own KSA is reachable.
  cloudMetadata:
    blockWithIptables: false

  # z2jh puts a NetworkPolicy on singleuser pods that denies egress to private IP
  # ranges. Open only the tpu-submit pods (port 8080) and the GKE metadata server
  # (needed by gcsfuse for Workload Identity). Students cannot reach other pods or the
  # Kubernetes API server.
  networkPolicy:
    enabled: true
    egressAllowRules:
      cloudMetadataServer: true
      privateIPs: false
    egress:
      - to:
          - podSelector:
              matchLabels:
                app.kubernetes.io/name: tpu-submit
        ports:
          - protocol: TCP
            port: 8080

  storage:
    type: dynamic
    # Tier 1: Persistent User Workspace (/home/jovyan)
    # 32Gi holds notebooks, code, local virtualenvs, and temporary caches.
    capacity: 32Gi
    dynamic:
      storageClass: standard-rwo-retain
    # Tier 2: Central Course Tartan Store (/tartan/11785 & /ocean) via GCS FUSE CSI Driver
    # Provides high-throughput shared access to course datasets, shared Python environments,
    # and starter notebooks. Read-only for students; read-write for admins via pre_spawn_hook.
    extraVolumes:
      - name: course-tartan
        csi:
          driver: gcsfuse.csi.storage.gke.io
          readOnly: true
          volumeAttributes:
            bucketName: __TARTAN_BUCKET__
            mountOptions: "implicit-dirs,file-cache:max-size-mb:0,metadata-cache:stat-cache-max-size-mb:2048,metadata-cache:ttl-secs:60,uid=1000,gid=1000,dir-mode=0777,file-mode=0777,ro"
    extraVolumeMounts:
      - name: course-tartan
        mountPath: /tartan/11785
        readOnly: true
      - name: course-tartan
        mountPath: /ocean
        readOnly: true
  # A notebook holds live state and a person is waiting on it. TPU jobs are fungible and
  # get student-tpu-job (100) instead, so chips yield and sessions do not.
  extraPodConfig:
    priorityClassName: student-notebook
    # GKE Sandbox (gVisor) provides strong container isolation. Cloud TPU pods
    # cannot use gVisor, so this is disabled on the Pinned TPU profile.
    runtimeClassName: gvisor
    securityContext:
      fsGroup: 1000
      fsGroupChangePolicy: "OnRootMismatch"
  extraEnv:
    # Where submit_tpu.py sends jobs. Same namespace, so the short Service name resolves.
    TPU_SUBMIT_URL: "http://tpu-submit:8080"
    SHARED_ENV_NAME: "__SHARED_ENV_NAME__"
    TARTAN_BUCKET: "__TARTAN_BUCKET__"
    # submit_tpu.py and platform_config.py are mounted here rather than into /home/jovyan,
    # because the home directory is a PVC and a ConfigMap mount would fight it.
    PYTHONPATH: "/opt/course"
    # Discover shared course kernels installed on /tartan/11785/share/jupyter/kernels
    JUPYTER_PATH: "/tartan/11785/share/jupyter:/ocean/share/jupyter:/opt/conda/share/jupyter"
  # 03_deploy_hub.sh fills stringData from notebooks/* with helm --set-file.
  extraFiles:
    platform_config.py:
      mountPath: /opt/course/platform_config.py
      stringData: "placeholder, replaced at deploy time"
    submit_tpu.py:
      mountPath: /opt/course/submit_tpu.py
      stringData: "placeholder, replaced at deploy time"
    student.env.template:
      mountPath: /opt/course/student.env.template
      stringData: "placeholder, replaced at deploy time"
    hw0_tpu_hello.ipynb:
      mountPath: /opt/course/hw0_tpu_hello.ipynb
      stringData: "placeholder, replaced at deploy time"
    tpu_platform_guide.ipynb:
      mountPath: /opt/course/00_tpu_platform_guide.ipynb
      stringData: "placeholder, replaced at deploy time"
  # Copy starter notebooks and .env template into the student's home directory on first spawn.
  # `cp -n` never overwrites existing student work on subsequent restarts.
  lifecycleHooks:
    postStart:
      exec:
        command:
          - "sh"
          - "-c"
          - >-
            mkdir -p /home/jovyan/checkpoints /home/jovyan/data &&
            cp -n /opt/course/*.ipynb /home/jovyan/ 2>/dev/null || true;
            cp -n /opt/course/student.env.template /home/jovyan/.env 2>/dev/null || true
  startTimeout: 900  # Extend to 900s for dynamic GKE Autopilot node scale-up and GCS FUSE attachment
  defaultUrl: "/lab"
  image:
    name: quay.io/jupyter/scipy-notebook
    tag: "2024-11-11"
    pullPolicy: IfNotPresent

  profileList:
    - display_name: "Course default (CPU notebook)"
      description: >-
        2 vCPU, 16 GB RAM, 32 GiB home disk + /tartan/11785 shared storage. Where you write and debug.
        Send training scripts to a TPU chip from here with submit_tpu.submit(); the chip is attached
        only while your job runs.
      default: true
      # Sized for CMU 11-785 HW2P2 image disk caching (~16 GiB uint8) with bursting headroom.
      # cpu_guarantee: 1 allows dense GKE Autopilot node packing while bursting to 2 vCPU.
      kubespawner_override:
        cpu_limit: 2
        cpu_guarantee: 1
        mem_limit: "16G"
        mem_guarantee: "4G"
        # Spot VMs cut notebook cost by 60-91%. Student state lives on the PVC,
        # so a preemption is just a page reload — no work lost.
        node_selector:
          cloud.google.com/gke-spot: "true"

    # Tier 1: Capstone Project / Research Grant Profile (visible to granted students + admins)
    - display_name: "Tier 1: Capstone Project Grant (4 vCPU, 32 GB RAM)"
      description: >-
        Expanded CPU & memory allocation for approved capstone teams and research grants,
        plus shared team storage under /tartan/11785/projects/<team-name>.
      allowed_groups:
        - project-grant-tier1
        - staff
      kubespawner_override:
        cpu_limit: 4
        cpu_guarantee: 2
        mem_limit: "32G"
        mem_guarantee: "8G"
        node_selector:
          cloud.google.com/gke-spot: "true"

    # Admin / Power User CPU Workstation (visible to instructors, TAs, and admins)
    - display_name: "Admin / Power User CPU Workstation (8 vCPU, 32 GB RAM)"
      description: >-
        High-memory CPU workstation for dataset preparation, grading pipelines,
        and managing student storage allocations via hub_admin.py. Mounts /tartan/11785 read-write.
      allowed_groups:
        - staff
        - admin
      kubespawner_override:
        cpu_limit: 8
        cpu_guarantee: 4
        mem_limit: "32G"
        mem_guarantee: "16G"
        node_selector:
          cloud.google.com/gke-spot: "true"

    - display_name: "Pinned TPU v5e-1 (1 Chip — Staff / Admin Only)"
      description: >-
        Single TPU v5e chip (ct5lp-hightpu-1t, 1x1 topology, 16 GB HBM) attached directly
        to the notebook for interactive debugging (~$1.35/hr). Staff & admins only.
      allowed_groups:
        - staff
        - admin
      kubespawner_override:
        image: us-docker.pkg.dev/cloud-tpu-images/jax-ai-image/tpu:latest
        extra_resource_limits:
          google.com/tpu: "1"
        extra_pod_config:
          # Cloud TPUs require direct hardware driver access, which is incompatible
          # with gVisor. Disable the hub-wide gVisor default for this profile.
          runtimeClassName: ""
        node_selector:
          cloud.google.com/gke-tpu-accelerator: tpu-v5-lite-podslice
          cloud.google.com/gke-tpu-topology: 1x1
        tolerations:
          - key: google.com/tpu
            operator: Exists
            effect: NoSchedule
        # Shorter leash than the CPU profiles. An idle pinned chip is the single most
        # expensive thing a person can leave running in this cluster.
        cull_timeout: 1800

    - display_name: "Pinned TPU v5e-4 (4 Chips, 2x2 Pod Slice — Staff / Admin Only)"
      description: >-
        4-chip TPU v5e pod slice (ct5lp-hightpu-4t, 2x2 topology, 64 GB total HBM) for
        multi-chip data/model parallelism (pmap / shard_map) debugging (~$5.40/hr). Staff & admins only.
      allowed_groups:
        - staff
        - admin
      kubespawner_override:
        image: us-docker.pkg.dev/cloud-tpu-images/jax-ai-image/tpu:latest
        extra_resource_limits:
          google.com/tpu: "4"
        extra_pod_config:
          runtimeClassName: ""
        node_selector:
          cloud.google.com/gke-tpu-accelerator: tpu-v5-lite-podslice
          cloud.google.com/gke-tpu-topology: 2x2
        tolerations:
          - key: google.com/tpu
            operator: Exists
            effect: NoSchedule
        cull_timeout: 1800
